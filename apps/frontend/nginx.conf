# Serves the built React app and proxies API/upload requests to the backend, mirroring
# apps/frontend/vite.config.ts's dev-server proxy split. "backend" is the in-cluster Kubernetes
# Service name defined in deploy/k8s/backend-service.yaml — this config is coupled to that name.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (React Router) - fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mirrors vite.config.ts's '/api' proxy: strips the /api prefix before forwarding.
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mirrors vite.config.ts's '/uploads' proxy: no prefix rewrite.
    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
