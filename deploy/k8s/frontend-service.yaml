# NodePort — this is the single in-cluster entry point the external nginx VM proxies to
# (research.md §9). The frontend container's own nginx (apps/frontend/nginx.conf) proxies
# /api and /uploads to the "backend" Service internally, so nothing else needs external exposure.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: sample-app
    component: frontend
spec:
  type: NodePort
  selector:
    app: sample-app
    component: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
