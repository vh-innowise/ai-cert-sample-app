# ClusterIP only — Postgres is never reachable outside the cluster (data-model.md §4).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: sample-app
    component: postgres
spec:
  type: ClusterIP
  selector:
    app: sample-app
    component: postgres
  ports:
    - port: 5432
      targetPort: 5432
