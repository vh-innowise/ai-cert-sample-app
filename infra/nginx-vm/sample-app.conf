# Reference nginx config for the external "nginx VM" (research.md §9, data-model.md §5).
# This is documentation/reference only — it is NOT applied automatically by any pipeline in this
# repo (the nginx VM is a pre-existing, out-of-repo machine per the feature spec's Assumptions).
# An operator installs this as e.g. /etc/nginx/sites-available/sample-app.conf on that VM.
#
# Replace before use:
#   <K3S_NODE_IP>  — the local k3s node's IP address (the frontend Service's NodePort target)
#   <NODE_PORT>    — must match deploy/k8s/frontend-service.yaml's nodePort (30080 by default)
#   /etc/ssl/...   — paths to the self-signed certificate covering both hostnames below
#                    (generation steps: infra/nginx-vm/README.md)

# sample-app.accelerator.test — the only hostname that serves the app (FR-014).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sample-app.accelerator.test;

    ssl_certificate     /etc/ssl/accelerator-test/fullchain.pem;
    ssl_certificate_key /etc/ssl/accelerator-test/privkey.pem;

    location / {
        proxy_pass http://<K3S_NODE_IP>:<NODE_PORT>;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name sample-app.accelerator.test;
    return 301 https://$host$request_uri;
}

# accelerator.test (bare domain) — deliberately does NOT route to the sample app (FR-017), so
# other apps can be added under their own subdomains on this same VM/cert without collision.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name accelerator.test _;

    ssl_certificate     /etc/ssl/accelerator-test/fullchain.pem;
    ssl_certificate_key /etc/ssl/accelerator-test/privkey.pem;

    return 404;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name accelerator.test _;
    return 404;
}
